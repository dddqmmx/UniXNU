["os"]
# The iOS 26.5.2 (23F84) userland of an arm64e restore image, run on a board without pointer
# authentication: XNU is built as ordinary ARM64 from xnu-12377 and the arm64e userland (launchd,
# dyld, the shared cache) is lowered to arm64 and re-signed offline. There is no prelink: the
# target kernelcache is arm64e, so its kexts cannot be linked into an arm64 kernel.
"name" = "ipados-26.5.2-23F84-arm64"
"arch" = "arm64-ios26"
"darwin" = "25.5.0"
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
# 12377 carries iokit/DriverKit; EXTERNAL_HEADERS/TrustCache comes from the last tag that ships it.
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
"ios_version" = "26.0"
"abi" = []


["ipsw"]
# iPad Pro M4 (iPad17,3), iPadOS 26.5.2. The family must match the device identity the ADT carries.
"url" = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-25976/000BB0A6-045B-47FF-AE4E-D8BF722E24FD/iPad17,1,iPad17,2,iPad17,3,iPad17,4_26.5.2_23F84_Restore.ipsw"
"product" = "iPad17,3"
"version" = "26.5.2"
"build" = "23F84"
"device_class" = "j820ap"
"chip_id" = 33090
"board_id" = 12
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]


["kernel"]
# The kernel is built but not prelinked; the payload step takes the linked Mach-O from here.
"outputs" = ["build/xnu-12377.121.6/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"]


["adt"."root"."string"]
"model" = "iPad17,3"
"target-type" = "J820"
"compatible" = "J820AP"


["adt"."chosen"."string"]
"osenvironment" = "main"
"crypto-hash-method" = "sha2-384"


["adt"."chosen"."u32"]
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1


