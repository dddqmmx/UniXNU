[os]
# SDM710 has no pointer authentication. This profile needs an ARM64 XNU plus offline-lowered
# arm64e userland; the original arm64e kernelcache cannot be prelinked into this kernel.
name = "ios-26.5.2-23F84-arm64"
arch = "arm64-ios26"
darwin = "25.5.0"
xnu_version = "12377.121.6"
xnu_revision = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
driverkit_tag = "xnu-12377.121.6"
trustcache_tag = "xnu-8796.101.5"
ios_version = "26.0"
abi = []

[ipsw]
# Same iPhone restore identity as none24smu/UniXNU-zeta @ eb48928.
url = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-26432/CF51E589-7C43-4B55-B909-CF585DAD0570/iPhone18,2_26.5.2_23F84_Restore.ipsw"
product = "iPhone18,2"
version = "26.5.2"
build = "23F84"
device_class = "v54ap"
chip_id = 0x8150
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"DeviceTree.v54ap.im4p" = "9305d468d6a97f6e57842b5866359ad473434b5d507ea3e4b4123f29edda8218"
"094-54256-108.dmg.aea.trustcache" = "c57bd130523563b2d68737d17cfa55bc36a33c7b69c226c721403ee5b6760676"
"094-54345-109.dmg.aea.trustcache" = "2fe341653972540bd9c9afa3c82c6451774c046f84a991a974f9461d83dd2f90"

[kernel]
outputs = ["build/xnu-12377.121.6/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"]

[payload.adt]
chip_id = "8150"

[adt.root.string]
model = "iPhone18,2"
target-type = "V54"
compatible = "V54AP"

[adt.chosen.string]
osenvironment = "main"
crypto-hash-method = "sha2-384"

[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
amfi-only-platform-code = 1

[adt.product.string]
product-name = "iPhone 17 Pro Max"
product-description = "iPhone 17 Pro Max"
artwork-device-idiom = "phone"
artwork-display-gamut = "P3"
artwork-dynamic-displaymode = "0"
compatible-device-fallback = "iPhone17,2"
sub-product-type = "iPhone18,2"
partition-style = "iOS"
# Keep the stock Apple Mach-O architecture string in /product even though offline
# lowering rewrites executable headers to ordinary ARM64 on non-PAC SoCs.
app-macho-architecture = "arm64e"

[adt.product.u32]
artwork-device-subtype = 2868
artwork-scale-factor = 3
thin-bezel = 1
oled-display = 1

[adt.buttons.u32]
home-button-type = 2

